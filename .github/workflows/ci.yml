name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      test-project: tool/NfeReportTool.Tests/NfeReportTool.Tests.csproj
      dotnet-version: "10.0.x"
      coverage-threshold: "80"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tool/global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -e cli -r cli/requirements-dev.txt
      - name: Ruff
        run: ruff check cli
      - name: Pytest (unit)
        run: pytest cli/tests -v -m "not e2e"
