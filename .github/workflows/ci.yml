name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      test-project: tool/NfeReportTool.Tests/NfeReportTool.Tests.csproj
      dotnet-version: "10.0.x"
      coverage-threshold: "80"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tool/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -e cli -r cli/requirements-dev.txt
      - name: Ruff
        run: ruff check cli
      - name: Pytest (unit)
        run: pytest cli/tests -v -m "not e2e"
      - name: Pack dotnet tool
        run: dotnet pack tool/NfeReportTool/NfeReportTool.csproj -c Release -o nupkg
      - name: Install local tool
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="local" value="nupkg" />\n  </packageSources>\n</configuration>\n' > nupkg/nuget.local.config
          dotnet tool install --global nfe-report --configfile nupkg/nuget.local.config
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Pytest (e2e)
        run: pytest cli/tests -v -m e2e
