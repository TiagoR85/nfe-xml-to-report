[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-cli"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["lxml==6.1.3"]

[project.scripts]
nfecli = "nfe_cli.main:main"

[tool.setuptools.packages.find]
include = ["nfe_cli*"]

[tool.pytest.ini_options]
markers = [
    "e2e: testes end-to-end que exigem o dotnet tool nfe-report instalado",
]
